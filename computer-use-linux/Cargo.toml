[package]
name = "codex-computer-use-linux"
version = "0.7.33"
edition = "2021"

[[bin]]
name = "codex-computer-use-linux"
path = "src/main.rs"

[[bin]]
name = "codex-chrome-extension-host"
path = "src/bin/codex-chrome-extension-host.rs"

[[bin]]
name = "codex-computer-use-cosmic"
path = "src/bin/codex-computer-use-cosmic.rs"

[[bin]]
name = "codex-computer-use-indicator"
path = "src/bin/computer-use-linux-indicator/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
anyhow = "1.0.102"
# atspi without its "connection" feature: that feature pulls atspi-connection
# with default features, which include "p2p" — and p2p peer enumeration during
# connect() calls GetInterfaces on every a11y-bus peer, so a single
# AppArmor-confined peer (e.g. snap-packaged Slack) aborts the whole
# AccessibilityConnection. We deliberately never use P2P routing (upstream
# computer-use-linux issue #31), so depend on atspi-connection directly with
# p2p off.
atspi = { version = "0.29.0", default-features = false, features = ["proxies", "wrappers", "tokio"] }
atspi-connection = { version = "0.13.0", default-features = false, features = ["wrappers"] }
base64 = "0.22.1"
evdev = "0.13.2"
cosmic-protocols = { version = "0.2.0", default-features = false, features = ["client"] }
futures-util = "0.3.32"
getrandom = "0.4.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
reis = { version = "0.7.1", features = ["tokio"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
skrifa = { version = "0.42", default-features = false, features = ["std"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
xkbcommon-dl = "0.4.2"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# Pure-Rust X11 client (no libxcb). Native X11 sessions only: absolute window
# origins for the EWMH backend (wmctrl -lG counts the frame offset twice,
# upstream #157) and the root-window screenshot route (upstream #155).
x11rb = { version = "0.14", features = ["xkb"] }
xkeysym = "0.2.1"
zbus = "5.14.0"
