name: Enforce contributor pull request limit

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  queue-event:
    name: Queue pull request limit check
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Mark pull request for enforcement
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const label = {
              name: 'pr-limit-pending',
              color: 'd4c5f9',
              description: 'Temporary marker for queued pull request limit enforcement',
            };
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label.name });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label.name],
            });

  enforce-limit:
    name: Enforce contributor pull request limit
    needs: queue-event
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    concurrency:
      group: contributor-pr-limit-${{ github.event.pull_request.user.login }}
      cancel-in-progress: false
    steps:
      # pull_request_target grants write access for fork PRs. Always load the
      # enforcement code from the trusted default branch, never from the PR.
      - name: Check out trusted enforcement code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enforce open pull request limit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MAX_OPEN_PRS_PER_CONTRIBUTOR: ${{ vars.MAX_OPEN_PRS_PER_CONTRIBUTOR }}
          MAX_OPEN_PRS_PER_CONTRIBUTOR_OVERRIDES: ${{ vars.MAX_OPEN_PRS_PER_CONTRIBUTOR_OVERRIDES }}
        with:
          script: |
            const { enforcePullRequestLimit } = require('./scripts/ci/enforce-pr-limit.js');
            await enforcePullRequestLimit({
              context,
              core,
              github,
              rawLimit: process.env.MAX_OPEN_PRS_PER_CONTRIBUTOR,
              rawOverrides: process.env.MAX_OPEN_PRS_PER_CONTRIBUTOR_OVERRIDES,
            });
