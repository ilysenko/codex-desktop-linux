name: Populate Cachix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: populate-cachix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  populate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      CACHIX_CACHE_NAME: codex-desktop-linux
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Require Cachix publishing credentials
        run: test -n "$CACHIX_AUTH_TOKEN"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: codex-desktop-linux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build pinned official Linux package outputs
        run: |
          set -euo pipefail
          for output in \
            .#codex-desktop \
            .#codex-desktop-maximal-directory-watch \
            .#codex-desktop-maximal-shallow-watch \
            .#checks.${{ matrix.system }}.modules \
            .#checks.${{ matrix.system }}.nix-runtime \
            .#checks.${{ matrix.system }}.nix-runtime-maximal-directory-watch \
            .#checks.${{ matrix.system }}.nix-runtime-maximal-shallow-watch \
            .#checks.${{ matrix.system }}.nix-installer; do
            paths="$(nix build "$output" --no-link --print-out-paths)"
            test -n "$paths"
            printf '%s\n' "$paths" | cachix push "$CACHIX_CACHE_NAME"
          done
