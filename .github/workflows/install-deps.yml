name: Install Dependencies

on:
  pull_request:
    paths:
      - install.sh
      - scripts/install-deps.sh
      - scripts/lib/install-deps-rust.sh
      - tests/install_deps_pacman_rust_matrix.sh
      - packaging/linux/control
      - .github/workflows/install-deps.yml
  push:
    branches:
      - main
    paths:
      - install.sh
      - scripts/install-deps.sh
      - scripts/lib/install-deps-rust.sh
      - tests/install_deps_pacman_rust_matrix.sh
      - packaging/linux/control
      - .github/workflows/install-deps.yml

permissions:
  contents: read

jobs:
  apt-node-bootstrap:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/ubuntu:22.04
          - docker.io/library/ubuntu:24.04
          - docker.io/library/debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Bootstrap sudo
        run: |
          apt-get update -qq >/dev/null
          apt-get install -y sudo ca-certificates >/dev/null

      - name: Install dependencies
        run: bash scripts/install-deps.sh

      - name: Verify Node.js toolchain
        run: |
          node -p "process.versions.node"
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'
          npm -v
          npx -v
          dpkg-query -W -f='${Provides}\n' nodejs | grep -E '(^|[,[:space:]])npm([,[:space:](]|$)'

      - name: Verify installer rejects retired source format after dependency preflight
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          output=$(./install.sh /tmp/nope.dmg 2>&1) && status=0 || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q "macOS DMG inputs are no longer supported"
          ! printf '%s\n' "$output" | grep -q "Node.js 20+ required"

  pacman-rust-bootstrap:
    name: pacman ${{ matrix.rust-state }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/library/archlinux:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        rust-state:
          - working-distro-cargo
          - rustup-without-toolchain
          - neither-rust-nor-rustup
          - shadowed-user-local-proxy
    steps:
      - name: Bootstrap checkout tools
        run: pacman -Syu --noconfirm --needed ca-certificates git

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verify pacman Rust bootstrap state
        env:
          CODEX_RUN_ARCH_INSTALL_DEPS_MATRIX: "1"
        run: bash tests/install_deps_pacman_rust_matrix.sh "${{ matrix.rust-state }}"
